[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "flext-cli @ git+https://github.com/flext-sh/flext-cli.git@0.12.0-dev",
  "flext-core @ git+https://github.com/flext-sh/flext-core.git@0.12.0-dev",
]
description = "FLEXT LDIF - Enterprise LDIF Processing Library"
keywords = ["adapter", "enterprise", "flext", "integration", "typed"]
license = "MIT"
name = "flext-ldif"
readme = "README.md"
requires-python = ">=3.13,<3.14"
version = "0.12.0"

[[project.authors]]
email = "team@flext.sh"
name = "FLEXT Team"

[[project.maintainers]]
email = "team@flext.sh"
name = "FLEXT Team"

[project.optional-dependencies]

[project.scripts]
flext-ldif = "flext_ldif.cli:main"

[project.urls]
Documentation = "https://github.com/flext-sh/flext/blob/main/README.md"
Homepage = "https://github.com/flext-sh/flext"
Repository = "https://github.com/flext-sh/flext"

[dependency-groups]
dev = [
  "types-networkx",
  "flext-infra @ git+https://github.com/flext-sh/flext-infra.git@0.12.0-dev",
  "mkdocstrings-python>=2.0.9",
  "actionlint-py>=1.7.12.24",
  "bandit>=1.9.4",
  "deptry",
  "editables>=0.6",
  "flext-tests @ git+https://github.com/flext-sh/flext-tests.git@0.12.0-dev",
  "hypothesis",
  "mkdocs",
  "mkdocs-autorefs",
  "mkdocs-exclude>=1.0.2",
  "mkdocs-git-revision-date-localized-plugin>=1.5.4",
  "mkdocs-material>=9.7.7",
  "mkdocs-mermaid2-plugin>=1.2.3",
  "mkdocs-minify-plugin>=0.8.0",
  "mkdocs-redirects>=1.2.3",
  "mkdocs-section-index>=0.3.12",
  "mkdocstrings>=1.0.6",
  "msgpack-types",
  "mypy>=2.3.1",
  "platformdirs>=4.12.0",
  "pymdown-extensions",
  "pyrefly>=1.2.0",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-asyncio",
  "pytest-benchmark",
  "pytest-cov",
  "pytest-markdown-docs",
  "pytest-randomly>=4.1.0",
  "pytest-reportlog",
  "pytest-testmon>=2.2.0",
  "pytest-timeout",
  "pytest-xdist",
  "ruff>=0.16.5",
  "rumdl>=0.2.62",
  "types-cachetools>=7.0.0.20260713",
  "types-cffi>=2.1.0.20260827",
  "types-click>=7.1.8",
  "types-defusedxml>=0.7.0.20260504",
  "types-docker>=7.2.0.20260827",
  "types-grpcio",
  "types-jsonschema>=4.26.0.20260518",
  "types-ldap3>=2.9.13.20260827",
  "types-openpyxl>=3.1.5.20260827",
  "types-paramiko>=5.0.0.20260724",
  "types-protobuf>=7.35.1.20260827",
  "types-psutil>=7.2.2.20260827",
  "types-psycopg2>=2.9.21.20260724",
  "types-pyasn1>=0.6.0.20260724",
  "types-pyopenssl>=24.1.0.20240722",
  "types-python-dateutil>=2.9.0.20260807",
  "types-pyyaml>=6.0.12.20260815",
  "types-redis>=4.6.0.20241004",
  "types-requests>=2.33.0.20260712",
  "types-setuptools>=84.0.0.20260812",
  "types-tabulate>=0.10.0.20260508",
  "types-toml>=0.10.8.20260518",
  "vulture>=2.16",
  "yamlfix>=1.19.1",
]
codegen = [
  "flext-infra @ git+https://github.com/flext-sh/flext-infra.git@0.12.0-dev",
]

[tool.flext.docs]
package_name = "flext_ldif"

[tool.hatch.build.targets.wheel]
only-include = ["src/flext_ldif"]

[tool.hatch.build.targets.wheel.sources]
"src/flext_ldif" = "flext_ldif"

[tool.hatch.build.targets.wheel.extra-metadata]
"pyproject.toml" = "pyproject.toml"

[tool.hatch.build.targets.sdist]
only-include = ["src/flext_ldif"]

[tool.hatch.build.targets.sdist.force-include]
"pyproject.toml" = "pyproject.toml"

[tool.hatch.metadata]
allow-direct-references = true

[tool.codespell]
check-filenames = true
ignore-words-list = "crate,nd"

[tool.coverage.report]
exclude_also = [
  "if _t.TYPE_CHECKING:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.run]
omit = [
  "*/dependency_injector/providers.pyx",
  "*/protocols.py",
  "*/_protocols/*",
]
source = ["src"]

[tool.deptry]
known_first_party = ["flext_ldif"]
optional_dependencies_dev_groups = []

[tool.mypy]
allow_redefinition = true
check_untyped_defs = true
disable_error_code = ["call-arg", "prop-decorator"]
exclude = "(?s:(?:.+/)?[^/]*\\.bak)\\Z|(?s:(?:.+/)?[^/]*\\.egg\\-info/.*)\\Z|(?s:(?:.+/)?[^/]*\\.orig)\\Z|(?s:(?:.+/)?[^/]*\\.rej)\\Z|(?s:(?:.+/)?[^/]*\\.swp)\\Z|(?s:(?:.+/)?\\.agents\\-sync\\-home/.*)\\Z|(?s:(?:.+/)?\\.agents/.*)\\Z|(?s:(?:.+/)?\\.archive/.*)\\Z|(?s:(?:.+/)?\\.beads/.*)\\Z|(?s:(?:.+/)?\\.benchmarks/.*)\\Z|(?s:(?:.+/)?\\.bkp/.*)\\Z|(?s:(?:.+/)?\\.cache/.*)\\Z|(?s:(?:.+/)?\\.claude/.*)\\Z|(?s:(?:.+/)?\\.codex/.*)\\Z|(?s:(?:.+/)?\\.cursor/.*)\\Z|(?s:(?:.+/)?\\.gemini/.*)\\Z|(?s:(?:.+/)?\\.git/.*)\\Z|(?s:(?:.+/)?\\.hypothesis/.*)\\Z|(?s:(?:.+/)?\\.kilo/.*)\\Z|(?s:(?:.+/)?\\.mypy_cache/.*)\\Z|(?s:(?:.+/)?\\.omo/.*)\\Z|(?s:(?:.+/)?\\.opencode/.*)\\Z|(?s:(?:.+/)?\\.pylance_cache/.*)\\Z|(?s:(?:.+/)?\\.pyrefly_cache/.*)\\Z|(?s:(?:.+/)?\\.pytest_cache/.*)\\Z|(?s:(?:.+/)?\\.reports/.*)\\Z|(?s:(?:.+/)?\\.ruff_cache/.*)\\Z|(?s:(?:.+/)?\\.serena/.*)\\Z|(?s:(?:.+/)?\\.snapshots/.*)\\Z|(?s:(?:.+/)?\\.test\\-tmp/.*)\\Z|(?s:(?:.+/)?\\.tmp/.*)\\Z|(?s:(?:.+/)?\\.tox/.*)\\Z|(?s:(?:.+/)?\\.venv\\.[^/]*/.*)\\Z|(?s:(?:.+/)?\\.venv/.*)\\Z|(?s:(?:.+/)?\\.vscode/.*)\\Z|(?s:(?:.+/)?\\.worktrees/.*)\\Z|(?s:(?:.+/)?__pycache__/.*)\\Z|(?s:(?:.+/)?__pyrefly_virtual__/.*)\\Z|(?s:(?:.+/)?_tmp_[^/]*/.*)\\Z|(?s:(?:.+/)?build/.*)\\Z|(?s:(?:.+/)?dist\\-packages/.*)\\Z|(?s:(?:.+/)?dist/.*)\\Z|(?s:(?:.+/)?htmlcov/.*)\\Z|(?s:(?:.+/)?incoming/.*)\\Z|(?s:(?:.+/)?legado/.*)\\Z|(?s:(?:.+/)?node_modules/.*)\\Z|(?s:(?:.+/)?reports/.*)\\Z|(?s:(?:.+/)?site\\-packages/.*)\\Z|(?s:(?:.+/)?site/.*)\\Z|(?s:(?:.+/)?target/.*)\\Z|(?s:(?:.+/)?venv/.*)\\Z"
explicit_package_bases = true
extra_checks = true
follow_imports = "normal"
follow_untyped_imports = true
local_partial_types = true
mypy_path = ["src"]
namespace_packages = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
python_version = "3.13"
show_traceback = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
follow_untyped_imports = true
module = ["rope.*"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyrefly]
disable-project-excludes-heuristics = true
project-excludes = [
  "**/*.bak",
  "**/*.egg-info/**",
