root = "src"

[[tool.pyright.executionEnvironments]]
extraPaths = [".", "src"]
reportPrivateUsage = "error"
root = "tests"

[[tool.pyright.executionEnvironments]]
extraPaths = [".", "src"]
reportPrivateUsage = "error"
root = "examples"

[tool.pytest.ini_options]
addopts = [
  "--benchmark-disable",
  "--strict-markers",
  "--markdown-docs",
  "--durations=10",
  "--ignore=tests/fixtures",
]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error", "once::pytest.PytestAssertRewriteWarning"]
flext_fixture_trees_root = "tests/fixtures"
flext_make_ci_value = "Y"
flext_make_ci_variable = "CI"
flext_slow_timeout_seconds = "25"
markers = [
  "smoke: public-interface smoke tests",
  "unit: unit tests",
  "integration: integration tests",
  "functional: functional behavior tests",
  "performance: performance and benchmark tests",
  "slow: slow-running tests",
  "docker: tests requiring Docker",
  "oracle: tests requiring the shared Oracle database",
  "remote: tests requiring remote/external network services",
  "e2e: end-to-end integration tests",
  "edge_cases: edge case tests",
  "stress: stress tests",
  "resilience: resilience tests",
  "discovery: catalog and stream discovery tests",
  "singer: Singer protocol contract tests",
  "requires_engine: native check engine required by this test",
]
minversion = "8.0"
python_classes = ["Test*"]
python_files = ["*_test.py", "*_tests.py", "test_*.py"]
testpaths = ["tests"]

