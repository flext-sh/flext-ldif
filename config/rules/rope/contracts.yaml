# flext-ldif's own Rope contract rules. flext-infra composes them after its
# packaged universal catalogue when `make mod` runs in this repository; they
# name flext_ldif identities, so they live here and nowhere else.
rules:
  - id: ldif-helper-internal-oid
    families: [u]
    pattern: '${extractor}(${definition})'
    goal: 'FlextLdifUtilitiesOID.extract_from_definition(${definition}, patterns=(c.Ldif.SCHEMA_OID_LEADING_RE,), empty_error=c.Ldif.SCHEMA_OID_EMPTY_ERROR)'
    arguments:
      extractor: name=flext_ldif._utilities._parser_schema_fields.FlextLdifParserSchemaFields.extract_oid
    imports:
      FlextLdifUtilitiesOID: from flext_ldif._utilities.oid import FlextLdifUtilitiesOID
      c: from flext_ldif import c
    bindings:
      FlextLdifUtilitiesOID.extract_from_definition: flext_ldif._utilities.oid.FlextLdifUtilitiesOID.extract_from_definition
  - id: ldif-helper-must-may
    pattern: '${extractor}(${definition})'
    goal: 'u.Ldif.extract_objectclass_must_may(${definition}, must_separator=c.Ldif.SCHEMA_MUST_SEPARATOR, may_separator=c.Ldif.SCHEMA_MAY_SEPARATOR)'
    arguments:
      extractor: name=flext_ldif.servers.relaxed_schema.FlextLdifServersRelaxedSchema._extract_must_may_from_objectclass
    imports: {u: 'from flext_ldif import u', c: 'from flext_ldif import c'}
    bindings:
      u.Ldif.extract_objectclass_must_may: flext_ldif._utilities.schema_extract.FlextLdifUtilitiesSchemaExtract.extract_objectclass_must_may
  - id: ldif-helper-oid
    pattern: '${extractor}(${definition})'
    goal: 'u.Ldif.extract_from_definition(${definition}, patterns=(c.Ldif.SCHEMA_OID_LEADING_RE,), empty_error=c.Ldif.SCHEMA_OID_EMPTY_ERROR)'
    arguments:
      extractor: name=flext_ldif._utilities._parser_schema_fields.FlextLdifParserSchemaFields.extract_oid
    imports: {u: 'from flext_ldif import u', c: 'from flext_ldif import c'}
    bindings:
      u.Ldif.extract_from_definition: flext_ldif._utilities.oid.FlextLdifUtilitiesOID.extract_from_definition
  - id: ldif-registry-owner-receiver
    phase: contract-normalization
    pattern: '${service}._server'
    goal: '${service}'
    arguments:
      service: type=flext_ldif.services.server.FlextLdifServer
  - id: ldif-api-explicit-instance
    phase: contract-normalization
    pattern: '${api}.fetch_global()'
    goal: '${api}()'
    arguments:
      api: name=flext_ldif.api.FlextLdif
  - id: ldif-server-composition-root
    phase: contract-normalization
    pattern: '${service}'
    goal: 'FlextLdif'
    arguments:
      service: name=flext_ldif.services.server.FlextLdifServer
    call_target: service
    missing_keywords: [registry]
    imports: {FlextLdif: 'from flext_ldif import FlextLdif'}
    bindings: {FlextLdif: flext_ldif.api.FlextLdif}
  - id: ldif-parser-composition-root
    phase: contract-normalization
    pattern: '${service}'
    goal: 'FlextLdif'
    arguments:
      service: name=flext_ldif.services.parser.FlextLdifParser
    call_target: service
    missing_keywords: [registry]
    imports: {FlextLdif: 'from flext_ldif import FlextLdif'}
    bindings: {FlextLdif: flext_ldif.api.FlextLdif}
  - id: ldif-writer-composition-root
    phase: contract-normalization
    pattern: '${service}'
    goal: 'FlextLdif'
    arguments:
      service: name=flext_ldif.services.writer.FlextLdifWriter
    call_target: service
    missing_keywords: [registry]
    imports: {FlextLdif: 'from flext_ldif import FlextLdif'}
    bindings: {FlextLdif: flext_ldif.api.FlextLdif}
  - id: ldif-acl-composition-root
    phase: contract-normalization
    pattern: '${service}'
    goal: 'FlextLdif'
    arguments:
      service: name=flext_ldif.services.acl.FlextLdifAcl
    call_target: service
    missing_keywords: [registry]
    imports: {FlextLdif: 'from flext_ldif import FlextLdif'}
    bindings: {FlextLdif: flext_ldif.api.FlextLdif}
  - id: ldif-detector-composition-root
    phase: contract-normalization
    pattern: '${service}'
    goal: 'FlextLdif'
    arguments:
      service: name=flext_ldif.services.detector.FlextLdifDetector
    call_target: service
    missing_keywords: [registry]
    imports: {FlextLdif: 'from flext_ldif import FlextLdif'}
    bindings: {FlextLdif: flext_ldif.api.FlextLdif}
  - id: ldif-conversion-composition-root
    phase: contract-normalization
    pattern: '${service}'
    goal: 'FlextLdif'
    arguments:
      service: name=flext_ldif.services.conversion.FlextLdifConversion
    call_target: service
    missing_keywords: [registry]
    imports: {FlextLdif: 'from flext_ldif import FlextLdif'}
    bindings: {FlextLdif: flext_ldif.api.FlextLdif}
  - id: ldif-categorization-composition-root
    phase: contract-normalization
    pattern: '${service}'
    goal: 'FlextLdif'
    arguments:
      service: name=flext_ldif.services.categorization.FlextLdifCategorization
    call_target: service
    missing_keywords: [registry]
    imports: {FlextLdif: 'from flext_ldif import FlextLdif'}
    bindings: {FlextLdif: flext_ldif.api.FlextLdif}
  - id: ldif-transformer-composition-root
    phase: contract-normalization
    pattern: '${service}'
    goal: 'FlextLdif'
    arguments:
      service: name=flext_ldif.services.transformers.FlextLdifTransformer
    call_target: service
    missing_keywords: [registry]
    imports: {FlextLdif: 'from flext_ldif import FlextLdif'}
    bindings: {FlextLdif: flext_ldif.api.FlextLdif}
  - id: ldif-processing-composition-root
    phase: contract-normalization
    pattern: '${service}'
    goal: 'FlextLdif().processing_pipeline'
    arguments:
      service: name=flext_ldif.services.pipeline.FlextLdifProcessingPipeline
    call_target: service
    missing_keywords: [registry]
    imports: {FlextLdif: 'from flext_ldif import FlextLdif'}
    bindings: {FlextLdif: flext_ldif.api.FlextLdif}
  - id: ldif-migration-composition-root
    phase: contract-normalization
    pattern: '${service}'
    goal: 'FlextLdif().migration_pipeline'
    arguments:
      service: name=flext_ldif.services.migration.FlextLdifMigrationPipeline
    call_target: service
    missing_keywords: [registry]
    imports: {FlextLdif: 'from flext_ldif import FlextLdif'}
    bindings: {FlextLdif: flext_ldif.api.FlextLdif}
  - id: ldif-oud-explicit-registry
    phase: contract-normalization
    pattern: '${service}()'
    goal: '${service}(registry=FlextLdif().registry)'
    arguments:
      service: name=flext_ldif.servers.oud.FlextLdifServersOud
    call_target: service
    missing_keywords: [registry]
    imports: {FlextLdif: 'from flext_ldif import FlextLdif'}
    bindings: {FlextLdif: flext_ldif.api.FlextLdif}
  - id: ldif-server-retire-singleton
    phase: contract-normalization
    pattern: '${service}.fetch_global_instance()'
    goal: 'FlextLdif()'
    arguments:
      service: name=flext_ldif.services.server.FlextLdifServer
    imports: {FlextLdif: 'from flext_ldif import FlextLdif'}
    bindings: {FlextLdif: flext_ldif.api.FlextLdif}
  - id: ldif-core-registry-port
    phase: contract-normalization
    pattern: '${factory}(registry=${service})'
    goal: '${factory}(registry=${service}.registry)'
    arguments:
      service:
        - type=flext_ldif.services.server.FlextLdifServer
        - type=flext_ldif._protocols.domain.FlextLdifProtocolsDomain.ServerRegistry
  - id: ldif-helper-acl
    pattern: '${splitter}(${line})'
    goal: 'u.Ldif.split_acl_line(${line})'
    arguments:
      splitter: name=flext_ldif.servers.novell.FlextLdifServersNovell.Acl.splitacl_line
    imports: {u: 'from flext_ldif import u'}
    bindings:
      u.Ldif.split_acl_line: flext_ldif._utilities._acl_format.FlextLdifACLFormatting.split_acl_line
  - id: ldif-helper-relaxed-oid
    pattern: |
      oid = ${extractor}(${definition})
      if not oid:
          return ${failure}
    goal: |
      oid_result = u.Ldif.extract_from_definition(${definition}, patterns=c.Ldif.OID_EXTRACTION_PATTERNS)
      if oid_result.failure:
          return ${failure}
      oid = oid_result.value
    arguments:
      extractor: name=flext_ldif.servers.relaxed_schema.FlextLdifServersRelaxedSchema._extract_oid_with_fallback_patterns
    imports: {u: 'from flext_ldif import u', c: 'from flext_ldif import c'}
    bindings:
      u.Ldif.extract_from_definition: flext_ldif._utilities.oid.FlextLdifUtilitiesOID.extract_from_definition
